<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 226" width="1020" height="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <clipPath id="clip1"><rect x="20" y="16" width="296" height="194" rx="8"/></clipPath>
    <clipPath id="clip2"><rect x="364" y="16" width="320" height="194" rx="8"/></clipPath>
    <clipPath id="clip3"><rect x="732" y="16" width="268" height="194" rx="8"/></clipPath>
  </defs>

  <rect x="2" y="2" width="1016" height="222" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Box 1: PDE -->
  <rect x="20" y="16" width="296" height="194" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="20" y="16" width="296" height="4" fill="#334155" clip-path="url(#clip1)"/>
  <text x="168" y="44" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Variable-Coefficient PDE</text>
  <rect x="36" y="56" width="264" height="36" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="168" y="79" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#0f172a">−∇·(<tspan font-style="italic">A</tspan>(<tspan font-style="italic">x</tspan>)∇<tspan font-style="italic">u</tspan>) + <tspan font-weight="bold">b</tspan>(<tspan font-style="italic">x</tspan>)·∇<tspan font-style="italic">u</tspan> + <tspan font-style="italic">c</tspan>(<tspan font-style="italic">x</tspan>)<tspan font-style="italic">u</tspan> = 0</text>
  <text x="38" y="116" font-size="11.5" fill="#334155">• Waveguides &amp; lenses: <tspan font-family="Georgia, serif" font-style="italic">c</tspan>(<tspan font-family="Georgia, serif" font-style="italic">x</tspan>) = −<tspan font-family="Georgia, serif" font-style="italic">k</tspan>(<tspan font-family="Georgia, serif" font-style="italic">x</tspan>)²</text>
  <text x="38" y="139" font-size="11.5" fill="#334155">• Advection–diffusion: variable <tspan font-family="Georgia, serif" font-weight="bold">b</tspan>(<tspan font-family="Georgia, serif" font-style="italic">x</tspan>)</text>
  <text x="38" y="162" font-size="11.5" fill="#334155">• Electrostatics: smooth <tspan font-family="Georgia, serif" font-style="italic">ε</tspan>(<tspan font-family="Georgia, serif" font-style="italic">x</tspan>) media</text>
  <text x="168" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">pde.py</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="326" y1="113" x2="354" y2="113" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Box 2: Singularity Split -->
  <rect x="364" y="16" width="320" height="194" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="364" y="16" width="320" height="4" fill="#0f766e" clip-path="url(#clip2)"/>
  <text x="524" y="44" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Singularity-Split Green's Function</text>
  <rect x="380" y="56" width="288" height="36" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="524" y="79" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#0f172a"><tspan font-style="italic">G</tspan>(<tspan font-style="italic">x, y</tspan>) = <tspan font-style="italic">G</tspan><tspan dy="3" font-size="9.5">0</tspan><tspan dy="-3">(</tspan><tspan font-style="italic">x, y</tspan>) + <tspan font-style="italic">H</tspan>(<tspan font-style="italic">x, y</tspan>)</text>
  <text x="382" y="116" font-size="11.5" fill="#334155">• Analytic singular parametrix <tspan font-family="Georgia, serif" font-style="italic">G</tspan><tspan dy="2.5" font-size="8.5">0</tspan><tspan dy="-2.5">(</tspan><tspan font-family="Georgia, serif" font-style="italic">x, y</tspan>)</text>
  <text x="382" y="139" font-size="11.5" fill="#334155">• Box FD remainder: <tspan font-family="Georgia, serif" font-style="italic">L</tspan><tspan dy="2.5" font-family="Georgia, serif" font-style="italic" font-size="8.5">x</tspan><tspan dx="2" dy="-2.5" font-family="Georgia, serif" font-style="italic">H</tspan> = −(<tspan font-family="Georgia, serif" font-style="italic">L</tspan><tspan dy="2.5" font-family="Georgia, serif" font-style="italic" font-size="8.5">x</tspan><tspan dx="3" dy="-2.5">−</tspan><tspan dx="3" font-family="Georgia, serif" font-style="italic">L</tspan><tspan dy="2.5" font-size="8.5">0</tspan><tspan dy="-2.5">)</tspan><tspan dx="2" font-family="Georgia, serif" font-style="italic">G</tspan><tspan dy="2.5" font-size="8.5">0</tspan></text>
  <text x="382" y="162" font-size="11.5" fill="#334155">• Single sparse LU + <tspan font-family="Georgia, serif" font-style="italic">C</tspan><tspan dy="-3.5" font-size="8.5">1</tspan><tspan dx="3" dy="3.5">cubic interpolation</tspan></text>
  <text x="524" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">split.py</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="694" y1="113" x2="722" y2="113" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Box 3: Boundary Solvers -->
  <rect x="732" y="16" width="268" height="194" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="732" y="16" width="268" height="4" fill="#1d4ed8" clip-path="url(#clip3)"/>
  <text x="866" y="44" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Boundary Solvers</text>
  <rect x="748" y="56" width="236" height="36" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="866" y="79" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#0f172a"><tspan font-style="italic">S</tspan> = <tspan font-style="italic">S</tspan><tspan dy="3" font-size="9.5">0</tspan><tspan dx="3" dy="-3">+</tspan><tspan dx="3" font-style="italic">S</tspan><tspan dy="3" font-style="italic" font-size="9.5">H</tspan><tspan dy="-3">,</tspan><tspan dx="10" font-style="italic">D</tspan> = <tspan font-style="italic">D</tspan><tspan dy="3" font-size="9.5">0</tspan><tspan dx="3" dy="-3">+</tspan><tspan dx="3" font-style="italic">D</tspan><tspan dy="3" font-style="italic" font-size="9.5">H</tspan></text>
  <text x="750" y="116" font-size="11.5" fill="#334155">• 3D bempp-cl DP0 operators</text>
  <text x="750" y="139" font-size="11.5" fill="#334155">• Proxy-source MFS (2D &amp; 3D)</text>
  <text x="750" y="162" font-size="11.5" fill="#334155">• Reused across moving boundaries</text>
  <text x="866" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748b">bempp_bridge.py · mfs.py</text>
</svg>
